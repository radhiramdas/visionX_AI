<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionX AI — Portal Authentication</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body style="background: var(--hero-bg); min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Minimal Header -->
    <header class="app-navbar" style="background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
        <div class="nav-container">
            <a href="/" class="brand-group">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M2 12c1.73-4.39 6-7.5 10-7.5s8.27 3.11 10 7.5c-1.73 4.39-6 7.5-10 7.5S3.73 16.39 2 12z"></path>
                    </svg>
                </div>
                <div class="brand-title" style="color: #ffffff;">
                    VisionX <span class="brand-accent">AI</span>
                </div>
            </a>
            <a href="/" class="btn-outline" style="color: #ffffff; border-color: rgba(255, 255, 255, 0.25);">
                &larr; Return to Home
            </a>
        </div>
    </header>

    <!-- Main Login Viewport -->
    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; background-image: radial-gradient(at 50% 50%, rgba(6, 182, 212, 0.08) 0px, transparent 60%);">
        <div class="auth-glass-card" style="margin: 0 auto; max-width: 480px; width: 100%;">
            <div class="auth-header">
                <h2 class="auth-title" id="login-title">Portal Sign In</h2>
                <p class="auth-subtitle" id="login-subtitle">Select your authorization level</p>
            </div>

            <!-- Role Selector: Staff, Doctor, Admin -->
            <div class="role-selector-grid" id="login-role-selector">
                <button type="button" class="role-btn active" data-role="staff" id="role-staff-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>Hospital Staff</span>
                </button>
                <button type="button" class="role-btn" data-role="doctor" id="role-doctor-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"></path>
                        <path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"></path>
                        <circle cx="20" cy="10" r="2"></circle>
                    </svg>
                    <span>Doctor</span>
                </button>
                <button type="button" class="role-btn" data-role="admin" id="role-admin-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    <span>Admin</span>
                </button>
            </div>

            <!-- Flash Error / Success Banner -->
            <div id="login-alert" class="alert-banner error" style="display: none;">
                <span id="login-alert-text"></span>
            </div>

            <!-- Login Form -->
            <form id="portal-login-form" class="auth-form" method="POST" action="/login">
                <input type="hidden" name="role" id="selected-role-input" value="staff">

                <div class="form-group-dark">
                    <label class="form-label-dark" for="input-identifier">Username or Email</label>
                    <div class="input-wrapper-dark">
                        <input type="text" id="input-identifier" name="identifier" class="form-input-dark" placeholder="Enter username or email" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group-dark">
                    <label class="form-label-dark" for="input-login-password">Password</label>
                    <div class="input-wrapper-dark">
                        <input type="password" id="input-login-password" name="password" class="form-input-dark" placeholder="Enter secure password" required autocomplete="current-password">
                        <button type="button" class="input-action-btn" id="toggle-login-password-btn" aria-label="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="portal-submit-btn" class="btn-auth-submit">
                    <span id="portal-submit-text">Sign In to Staff Portal</span>
                </button>
            </form>

            <div class="auth-footer">
                VisionX AI &bull; Secure Healthcare Access Control
            </div>
        </div>
    </main>

    <script>
        const roleBtns = document.querySelectorAll('#login-role-selector .role-btn');
        const roleInput = document.getElementById('selected-role-input');
        const submitText = document.getElementById('portal-submit-text');
        const loginTitle = document.getElementById('login-title');
        const alertBanner = document.getElementById('login-alert');
        const alertText = document.getElementById('login-alert-text');
        const form = document.getElementById('portal-login-form');

        roleBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                roleBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const role = btn.getAttribute('data-role');
                roleInput.value = role;

                if (role === 'staff') {
                    loginTitle.textContent = "Hospital Staff Sign In";
                    submitText.textContent = "Sign In to Staff Portal";
                } else if (role === 'doctor') {
                    loginTitle.textContent = "Doctor Clinical Sign In";
                    submitText.textContent = "Sign In to Doctor Portal";
                } else if (role === 'admin') {
                    loginTitle.textContent = "Administrator Portal";
                    submitText.textContent = "Sign In to Admin Portal";
                }
            });
        });

        // Toggle Password visibility
        const toggleBtn = document.getElementById('toggle-login-password-btn');
        const pwField = document.getElementById('input-login-password');
        if (toggleBtn && pwField) {
            toggleBtn.addEventListener('click', () => {
                const cur = pwField.getAttribute('type');
                pwField.setAttribute('type', cur === 'password' ? 'text' : 'password');
            });
        }

        // Form submission via AJAX
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBanner.style.display = 'none';

            const formData = {
                identifier: document.getElementById('input-identifier').value.trim(),
                password: pwField.value,
                role: roleInput.value
            };

            const submitBtn = document.getElementById('portal-submit-btn');
            submitBtn.disabled = true;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(formData)
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    alertText.textContent = data.error || "Authentication failed.";
                    alertBanner.style.display = 'flex';
                    submitBtn.disabled = false;
                } else {
                    window.location.href = data.redirect_url;
                }
            } catch (err) {
                alertText.textContent = "Network error. Please verify backend is running.";
                alertBanner.style.display = 'flex';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
